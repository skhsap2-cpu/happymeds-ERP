const DB_ROW_KEY = 'happymeds-db';
const SB_URL_KEY = 'happymeds_sb_url';
const SB_ANON_KEY = 'happymeds_sb_anon_key';

function getSupabaseConfig(){
  // 1) A one-time setup link (?sb_url=...&sb_key=...) saves to this browser, then cleans the URL.
  const params = new URLSearchParams(window.location.search);
  const linkUrl = params.get('sb_url');
  const linkKey = params.get('sb_key');
  if(linkUrl && linkKey){
    localStorage.setItem(SB_URL_KEY, linkUrl);
    localStorage.setItem(SB_ANON_KEY, linkKey);
    window.history.replaceState({}, '', window.location.pathname);
  }
  const url = localStorage.getItem(SB_URL_KEY);
  const key = localStorage.getItem(SB_ANON_KEY);
  return (url && key) ? {url, key} : null;
}
function saveSupabaseConfig(url, key){
  localStorage.setItem(SB_URL_KEY, url.trim().replace(/\/+$/, ''));
  localStorage.setItem(SB_ANON_KEY, key.trim());
}

async function supabaseGetDb(){
  const cfg = getSupabaseConfig();
  if(!cfg) throw new Error('Not configured');
  const url = `${cfg.url}/rest/v1/app_data?key=eq.${DB_ROW_KEY}&select=value`;
  const res = await fetch(url, {
    headers: { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key }
  });
  if(!res.ok) throw new Error('Supabase read failed: ' + res.status);
  const rows = await res.json();
  return (rows && rows[0] && rows[0].value) ? rows[0].value : null;
}
async function supabaseSaveDb(data){
  const cfg = getSupabaseConfig();
  if(!cfg) throw new Error('Not configured');
  const url = `${cfg.url}/rest/v1/app_data?on_conflict=key`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      apikey: cfg.key,
      Authorization: 'Bearer ' + cfg.key,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify([{ key: DB_ROW_KEY, value: data, updated_at: new Date().toISOString() }]),
  });
  if(!res.ok) throw new Error('Supabase write failed: ' + res.status);
}

      // fill in any new default fields for forward-compat
      const def = defaultDb();
      db.settings = Object.assign({}, def.settings, db.settings);
      db.counters = Object.assign({}, def.counters, db.counters);
      if(!db.estimates) db.estimates = [];
      // migrate users saved before login existed
      const seenUsernames = new Set();
      (db.users||[]).forEach((u,idx)=>{
        if(!u.username){
          let base = (u.name||'user'+idx).toLowerCase().replace(/[^a-z0-9]+/g,'') || ('user'+idx);
          let candidate = base, n = 1;
          while(seenUsernames.has(candidate)){ candidate = base + (n++); }
          u.username = candidate;
        }
        seenUsernames.add(u.username.toLowerCase());
        if(!u.password) u.password = 'changeme123';
      });
    } else {
      // A successful query that genuinely found nothing — this is the ONLY case
      // where creating a fresh default database is safe.
      db = defaultDb();
      await saveDb();
    }
  }catch(e){
    // The read itself failed (bad connection, wrong/misconfigured credentials, etc.).
    // NEVER fabricate blank data here — doing so would overwrite real data in
    // Supabase the moment saveDb() next runs. Show a retry screen instead and
    // leave whatever is actually stored completely untouched.
    console.error('Supabase load failed', e);
    dbLoadError = (e && e.message) ? e.message : 'Could not reach the database.';
    render();
    return;
  }
  // grant Sales stock visibility + PO creation, additive so any admin customization is preserved
  if(db && db.settings && db.settings.permissions && db.settings.permissions.Sales){
    ['inventory','purchase','dispatch','training'].forEach(k=>{
      if(!db.settings.permissions.Sales.includes(k)) db.settings.permissions.Sales.push(k);
    });
  }
  if(db && db.settings){
    if(!db.serviceTickets) db.serviceTickets = [];
    if(!db.firms) db.firms = [];
    if(!db.settings.roles.includes('Service')) db.settings.roles.push('Service');
    ['Custom Role 1','Custom Role 2','Custom Role 3'].forEach(r=>{
      if(!db.settings.roles.includes(r)) db.settings.roles.push(r);
      if(!db.settings.permissions[r]) db.settings.permissions[r] = ['dashboard'];
    });
    if(!db.settings.permissions.Service) db.settings.permissions.Service = ['dashboard','service','servicePayments','reports'];
    const grantAdditive = (role, keys)=>{
      if(!db.settings.permissions[role]) return;
      keys.forEach(k=>{ if(!db.settings.permissions[role].includes(k)) db.settings.permissions[role].push(k); });
    };
    grantAdditive('Admin', ['collections','service','servicePayments','approval']);
    grantAdditive('Sales', ['collections','service','approval']);
    grantAdditive('Service', ['servicePayments']);
    grantAdditive('Accounts', ['collections']);
    if(db.users && !db.users.some(u=>u.username==='service1')){
      db.users.push({id:'U_SVC', name:'Service Team', username:'service1', password:'service123', role:'Service'});
    }
    if(!db.settings.serviceChargeRoles) db.settings.serviceChargeRoles = ['Service','Admin'];
    if(!db.activityLog) db.activityLog = [];
    (db.serviceTickets||[]).forEach(t=>{ if(!t.history) t.history = []; });
  }
  // guaranteed recovery account — always present, on every load path, so a login is never permanently blocked
  if(db && db.users && !db.users.some(u=>u.username==='superadmin')){
    db.users.push({id:'U_RECOVERY', name:'Recovery Admin', username:'superadmin', password:'HappyMeds@2026', role:'Admin'});
  }
  restoreSession();
  render();
}

function itemTaxableAmount(it){
  const base = Number(it.qty||0) * Number(it.unitPrice||0);
  const discPct = Number(it.discountPct||0);
  return base * (1 - discPct/100);
}
function itemGstAmount(it){
  return itemTaxableAmount(it) * (Number(it.gstRate||0)/100);
}
function orderTaxableTotal(order){
  return (order.items||[]).reduce((s,it)=>s+itemTaxableAmount(it),0);
}
function orderGstTotal(order){
  return (order.items||[]).reduce((s,it)=>s+itemGstAmount(it),0);
}
function orderPreRoundTotal(order){
  return orderTaxableTotal(order) + orderGstTotal(order) + Number(order.shippingCharge||0);
}
function orderRoundOff(order){
  if(order.roundOffEnabled===false) return 0;
  const raw = orderPreRoundTotal(order);
  return Math.round(raw) - raw;
}
function orderTotal(order){
  return orderPreRoundTotal(order) + orderRoundOff(order);
}
function isInterState(order){
  const custState = (order.customerState||'').trim().toLowerCase();
  const homeState = (db.settings.companyState||'').trim().toLowerCase();
  return custState && homeState && custState !== homeState;
}

  return String(startYear).slice(-2) + '-' + String(startYear+1).slice(-2);
}

const NUM_WORDS_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const NUM_WORDS_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function numToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'Zero';
  function twoDigits(n){
    if(n<20) return NUM_WORDS_ONES[n];
    return NUM_WORDS_TENS[Math.floor(n/10)] + (n%10? ' '+NUM_WORDS_ONES[n%10] : '');
  }
  function threeDigits(n){
    if(n<100) return twoDigits(n);
    return NUM_WORDS_ONES[Math.floor(n/100)] + ' Hundred' + (n%100? ' '+twoDigits(n%100) : '');
  }
  const crore = Math.floor(num/10000000); num %= 10000000;
  const lakh = Math.floor(num/100000); num %= 100000;
  const thousand = Math.floor(num/1000); num %= 1000;
  const rest = num;
  let parts = [];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(rest) parts.push(threeDigits(rest));
  return parts.join(' ');
}
function amountInWords(n){
  return numToWordsIndian(n) + ' Rupees only';
}
function computeTaxBreakdown(order){
  const groups = {};
  (order.items||[]).forEach(it=>{
    const rate = Number(it.gstRate||0);
    groups[rate] = (groups[rate]||0) + itemTaxableAmount(it);
  });
  const interState = isInterState(order);
  const rows = [];
  Object.keys(groups).sort((a,b)=>Number(a)-Number(b)).forEach(rateKey=>{
    const rate = Number(rateKey);
    const taxableAmt = groups[rateKey];
    if(rate<=0 || taxableAmt<=0) return;
    if(interState){
      rows.push({type:'IGST', taxable: taxableAmt, rate: rate, tax: taxableAmt*rate/100});
    } else {
      rows.push({type:'CGST', taxable: taxableAmt, rate: rate/2, tax: taxableAmt*rate/200});
      rows.push({type:'SGST', taxable: taxableAmt, rate: rate/2, tax: taxableAmt*rate/200});
    }
  });
  return rows;
}
function orderPaymentStatus(order){
  const total = orderTotal(order);
  const paid = Number(order.paymentReceived)||0;
  if(paid<=0) return 'Payment Pending';
  if(paid>=total && total>0) return 'Full';
  return 'Partial';
}
function orderStockOk(order){
  return (order.items||[]).every(it=>{
    const inv = findInventoryByName(it.product);
    return inv && inv.stockQty >= Number(it.qty);
  });
}

    contact: fd.get('contact')||'',
    customerGstin: fd.get('customerGstin')||'',
    customerState: fd.get('customerState')||'',

function stockInfoText(productName){
  if(!productName) return '';
  const inv = findInventoryByName(productName);
  if(!inv) return 'Not in inventory yet — you can still add it to this document.';
  if(inv.stockQty<=0) return `⚠ Out of stock (0 in inventory)`;
  if(inv.stockQty<=inv.reorderLevel) return `⚠ Low stock — ${inv.stockQty} available`;
  return `${inv.stockQty} available in stock`;
}

function renderBilledItemsList(kind, items){
  if(!items.length) return '<div class="note" style="margin-bottom:12px;">No items added yet.</div>';
  const showStock = kind==='order';
  let shortfallCount = 0;
  const rows = items.map((it,idx)=>{
    let stockLine = '';
    if(showStock){
      const inv = findInventoryByName(it.product);
      const have = inv ? inv.stockQty : 0;
      const need = Number(it.qty)||0;
      if(!inv){
        stockLine = `<div class="muted" style="font-size:11px;margin-top:2px;">Not in inventory yet</div>`;
      } else if(have>=need){
        stockLine = `<div style="font-size:11px;margin-top:2px;color:var(--green);">✓ In stock (${have} available)</div>`;
      } else {
        shortfallCount++;
        stockLine = `<div style="font-size:11px;margin-top:2px;color:var(--red);">⚠ Short by ${need-have} — only ${have} available</div>`;
      }
    }
    return `
        <div class="billed-item">
          <div>
            <div style="font-weight:500;font-size:13.5px;">#${idx+1} ${escapeHtml(it.product)}${it.hsn?` <span class="muted mono" style="font-size:11px;">(${escapeHtml(it.hsn)})</span>`:''}</div>
            <div class="muted" style="font-size:12px;">${it.qty} ${escapeHtml(it.unit||'Pcs')} × ${fmtMoney(it.unitPrice)}${Number(it.discountPct)>0?` · Disc ${it.discountPct}%`:''} · GST ${it.gstRate||0}%</div>
            ${it.description?`<div class="muted" style="font-size:11.5px;margin-top:2px;">${escapeHtml(it.description)}</div>`:''}
            ${stockLine}
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div class="mono" style="font-size:13px;font-weight:600;">${fmtMoney(itemTaxableAmount(it)+itemGstAmount(it))}</div>
            <div class="flexline" style="gap:8px;justify-content:flex-end;">
              <button type="button" class="link-btn" style="font-size:11.5px;" data-edit-draft-item="${kind}:${idx}">Edit</button>
              <button type="button" class="link-btn" style="color:var(--red);font-size:11.5px;" data-remove-draft-item="${kind}:${idx}">Remove</button>
            </div>
          </div>
        </div>`;
  }).join('');
  const summary = showStock ? (
    shortfallCount>0
      ? `<div class="banner" style="background:var(--red-bg);color:var(--red);">⚠ ${shortfallCount} item${shortfallCount>1?'s are':' is'} short of stock. You can still save the order — a purchase order can be raised for the shortfall afterward.</div>`
      : `<div class="banner" style="background:var(--green-bg);color:var(--green);">✓ All items are currently available in stock.</div>`
  ) : '';
  return `
    <div class="panel" style="padding:8px 14px;margin-bottom:14px;">
      <div style="font-weight:600;font-size:12px;padding:6px 0;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;">Billed items</div>
      ${rows}
    </div>
    ${summary}
  `;
}
/* ---------------- Pending Collections ---------------- */
function renderCollections(){
  const sub = ui.subtab.collections || 'pending';

  const pending = db.orders
    .filter(o=>orderPaymentStatus(o)!=='Full')
    .map(o=>({
      order:o,
      total: orderTotal(o),
      paid: Number(o.paymentReceived)||0,
      balance: orderTotal(o) - (Number(o.paymentReceived)||0),
      days: Math.max(0, Math.floor((Date.now() - new Date(o.createdDate).getTime())/86400000)),
    }))
    .sort((a,b)=>b.balance-a.balance);
  const totalOutstanding = pending.reduce((s,x)=>s+x.balance,0);

  const completed = db.orders
    .filter(o=>orderPaymentStatus(o)==='Full' && orderTotal(o)>0)
    .map(o=>{
      const hist = o.paymentHistory||[];
      const lastPaid = hist.length ? hist[hist.length-1] : null;
      return { order:o, total: orderTotal(o), paid: Number(o.paymentReceived)||0, lastPaid };
    })
    .sort((a,b)=> (b.lastPaid? b.lastPaid.date+(b.lastPaid.time||'') : b.order.createdDate).localeCompare(a.lastPaid? a.lastPaid.date+(a.lastPaid.time||'') : a.order.createdDate));
  const totalCollected = completed.reduce((s,x)=>s+x.paid,0);

    <div class="cards-row">
      <div class="stat-card"><div class="stat-num">${pending.length}</div><div class="stat-label">Orders pending collection</div></div>

      pending.length? `<div class="table-wrap"><table><thead><tr>
        <th>Order</th><th>Customer</th><th>Contact</th><th>Invoice date</th><th>Total</th><th>Paid</th><th>Balance due</th><th>Days pending</th><th></th>
      </tr></thead><tbody>
        ${pending.map(x=>{
          const showHistory = ui.viewingPaymentHistoryId===x.order.id;
          const hist = x.order.paymentHistory||[];
          return `<tr>
          <td class="idcell">${x.order.id}</td>
          <td>${escapeHtml(x.order.customerName)}</td>
          <td>${escapeHtml(x.order.contact||'—')}</td>
          <td>${fmtDate(x.order.createdDate)}</td>
          <td>${fmtMoney(x.total)}</td>
          <td>${fmtMoney(x.paid)}</td>
          <td style="font-weight:600;">${fmtMoney(x.balance)}</td>
          <td class="mono">${x.days}</td>
          <td class="actrow">
            <button class="link-btn" data-add-payment="${x.order.id}">Record payment</button>
            ${hist.length? `<button class="link-btn" data-toggle-payment-history="${x.order.id}">${showHistory?'Hide':'View'} history (${hist.length})</button>`:''}
          </td>
        </tr>
        ${showHistory && hist.length? `<tr><td colspan="9" style="padding:0;">
          <div style="margin:6px 10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;">
            ${hist.map(p=>`<div class="kv" style="font-size:12.5px;"><span>${fmtDate(p.date)} at ${escapeHtml(p.time||'—')} — ${escapeHtml(p.user||'—')}</span><span class="mono">${fmtMoney(p.amount)}</span></div>`).join('')}
          </div>
        </td></tr>`:''}`;
        }).join('')}
      </tbody></table></div>` : `<div class="empty-state"><strong>All caught up</strong>No orders currently have an outstanding balance.</div>`
    ) : (
      completed.length? `<div class="table-wrap"><table><thead><tr>
        <th>Order</th><th>Customer</th><th>Total</th><th>Paid in full on</th><th>Collected by</th><th></th>
      </tr></thead><tbody>
        ${completed.map(x=>{
          const showHistory = ui.viewingPaymentHistoryId===x.order.id;
          const hist = x.order.paymentHistory||[];
          return `<tr>
          <td class="idcell">${x.order.id}</td>
          <td>${escapeHtml(x.order.customerName)}</td>
          <td>${fmtMoney(x.total)}</td>
          <td>${x.lastPaid? fmtDate(x.lastPaid.date)+' at '+escapeHtml(x.lastPaid.time||''): fmtDate(x.order.createdDate)}</td>
          <td>${x.lastPaid? escapeHtml(x.lastPaid.user||'—') : '—'}</td>
          <td>${hist.length? `<button class="link-btn" data-toggle-payment-history="${x.order.id}">${showHistory?'Hide':'View'} history (${hist.length})</button>`:''}</td>
        </tr>
        ${showHistory && hist.length? `<tr><td colspan="6" style="padding:0;">
          <div style="margin:6px 10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;">
            ${hist.map(p=>`<div class="kv" style="font-size:12.5px;"><span>${fmtDate(p.date)} at ${escapeHtml(p.time||'—')} — ${escapeHtml(p.user||'—')}</span><span class="mono">${fmtMoney(p.amount)}</span></div>`).join('')}
          </div>

function renderOrderRow(o){
  const total = orderTotal(o);
  const payStatus = orderPaymentStatus(o);
  const stockOk = orderStockOk(o);
  const canApproveDispatch = ['Sales','Admin'].includes(currentRole());
  let actions = `<button class="btn small secondary" data-view-invoice="${o.id}">Invoice</button> <button class="btn small secondary" data-edit-order="${o.id}">Edit</button>`;
  if(o.status==='Payment Pending' || o.status==='Draft'){
    actions += ` <button class="btn small secondary" data-check-stock="${o.id}">Check stock</button>`;
  }
  if(o.status==='Stock Check'){
    if(stockOk){
      actions += canApproveDispatch
        ? `<button class="btn small" data-mark-ready="${o.id}">Approve for dispatch</button>`
        : `<span class="muted" style="font-size:12px;">Awaiting Sales approval</span>`;
    } else {
      actions += `<button class="btn small secondary" data-create-po-from="${o.id}">Create purchase order</button>`;
    }
  }
  if(o.status==='Awaiting Purchase'){
    actions += `<span class="muted" style="font-size:12px;">Waiting on PO / GRN</span>`;
  }
  if(o.status==='Ready to Dispatch' || o.status==='Partially Dispatched'){
    actions += `<span class="muted" style="font-size:12px;">See Dispatch tab</span>`;
  }
  if(o.status==='Delivered' && !o.trainingId){
    actions += `<button class="btn small secondary" data-schedule-training="${o.id}">Schedule training</button>`;
  }

  return `<tr>

  const rowFor = (i)=>{

    const lowOrOut = i.stockQty<=i.reorderLevel;
    return `<tr>
      <td>${escapeHtml(i.productName)}</td>

      <td class="mono">${i.stockQty}</td>

          <div class="field"><label>Reorder level</label><input name="reorderLevel" type="number" min="0" value="5"></div>
        </div>
        <div class="form-grid">

      </form>

      <div class="tabbtn ${sub==='stock'?'active':''}" data-invsub="stock">Stock</div>

        <th>Product</th><th>Category</th><th>In stock</th><th>Reorder level</th><th>Unit price</th><th>Batch / Expiry</th><th>Status</th><th></th>
      </tr></thead><tbody>${items.map(rowFor).join('')}</tbody></table></div>`

    )}
  `;

/* ---------------- Purchase Orders ---------------- */
function receivedQtyForPOItem(poId, product){
  return db.grns
    .filter(g=>g.poId===poId)
    .reduce((s,g)=>s + (g.items||[]).filter(it=>it.product===product).reduce((s2,it)=>s2+Number(it.qty||0),0), 0);
}
function poRemainingToReceive(po){
  return (po.items||[]).map(it=>({
    product: it.product,
    ordered: Number(it.qty||0),
    received: receivedQtyForPOItem(po.id, it.product),
    remaining: Math.max(0, Number(it.qty||0) - receivedQtyForPOItem(po.id, it.product)),
  }));
}
function renderPurchase(){
  const pos = db.purchaseOrders;
  const formOpen = ui.formOpen.po;
  const poPrefill = ui.pendingPoPrefill;
  ui.pendingPoPrefill = null;

  if(ui.viewingPOId) return renderPOView(ui.viewingPOId);
  if(ui.receivingPOId) return renderGRNReceiveView(ui.receivingPOId);

  return `
    <div class="section-head">
      <div><div class="section-sub">Raised when an order needs stock we don't currently hold.</div></div>
      <button class="btn" data-open="po">${formOpen?'Close form':'+ New purchase order'}</button>
    </div>
    ${formOpen? renderPoForm(poPrefill) : ''}
    ${pos.length? `<div class="table-wrap"><table><thead><tr>
      <th>PO ID</th><th>Supplier</th><th>Items</th><th>Linked order</th><th>Expected</th><th>Status</th><th></th>

      ${[...pos].sort((a,b)=>b.orderDate.localeCompare(a.orderDate)).map(p=>`<tr>
        <td class="idcell">${p.id}</td>
        <td>${escapeHtml(p.supplier)}</td>
        <td>${(p.items||[]).map(it=>escapeHtml(it.product)+' × '+it.qty).join('<br>')}</td>
        <td class="idcell">${p.linkedOrderId||'—'}</td>
        <td>${fmtDate(p.expectedDate)}</td>
        <td>${badge(p.status, statusTone(p.status))}</td>
        <td class="actrow">
          <button class="btn small secondary" data-view-po="${p.id}">View</button>
          ${(p.status==='Pending' || p.status==='Partially Received')? `<button class="btn small" data-open-grn="${p.id}">Receive (GRN)</button>`:''}

      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state"><strong>No purchase orders yet</strong>These get created when stock is short for an order, or you can raise one directly.</div>`}

function dispatchedQtyForOrderItem(orderId, product){
  return db.dispatches
    .filter(d=>d.orderId===orderId)
    .reduce((s,d)=>s + (d.items||[]).filter(it=>it.product===product).reduce((s2,it)=>s2+Number(it.qty||0),0), 0);
}
function orderRemainingToDispatch(order){
  return (order.items||[]).map(it=>({
    product: it.product,
    unit: it.unit||'Pcs',
    ordered: Number(it.qty||0),
    dispatched: dispatchedQtyForOrderItem(order.id, it.product),
    remaining: Math.max(0, Number(it.qty||0) - dispatchedQtyForOrderItem(order.id, it.product)),
  }));
}

function generateInvoicePdf(callback){
  const original = document.getElementById('invoiceSheet');
  if(!original || !window.jspdf || !window.html2canvas){ callback(null); return; }
  const DESKTOP_W = 794; // px — fixed A4-equivalent width, independent of the viewer's actual screen size
  let wrapper = null;
  try{
    const { jsPDF } = window.jspdf;

    // Clone into an offscreen container forced to full desktop width. Without this,
    // generating from a phone would capture the narrow, heavily-wrapped mobile layout
    // instead of a proper full-width document.
    const clone = original.cloneNode(true);
    clone.removeAttribute('id');
    clone.style.maxWidth = 'none';
    clone.style.width = DESKTOP_W + 'px';
    wrapper = document.createElement('div');
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-10000px';
    wrapper.style.top = '0';
    wrapper.style.width = DESKTOP_W + 'px';
    wrapper.style.background = '#ffffff';
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    const cleanup = ()=>{ if(wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper); };

    window.html2canvas(clone, {scale:2, backgroundColor:'#ffffff', windowWidth: DESKTOP_W})
      .then(function(canvas){
        cleanup();
        // Rasterizing first and placing the image ourselves avoids jsPDF's .html()
        // pagination logic entirely, which can otherwise insert a stray blank page
        // before the content in some scale/offset combinations.
        const doc = new jsPDF({unit:'pt', format:[595, 842]}); // true A4: 595×842pt
        const margin = 24;
        const usableW = 595 - margin*2;
        const usableH = 842 - margin*2;
        let drawW = usableW;
        let drawH = canvas.height * (drawW / canvas.width);
        if(drawH > usableH){
          drawH = usableH;
          drawW = canvas.width * (drawH / canvas.height);
        }
        const x = margin + (usableW - drawW) / 2;
        const y = margin;
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        doc.addImage(imgData, 'JPEG', x, y, drawW, drawH);
        try{ callback(doc.output('blob')); }
        catch(e){ callback(null); }
      })
      .catch(function(){
        cleanup();
        callback(null);
      });
  }catch(e){
    if(wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
    callback(null);
  }
}

function renderReportFilterBar(key, opts){

  const f = getReportFilter(key);
  return `

      <div class="form-grid">
        ${opts.noDate? '' : `
        <div class="field"><label>From date</label><input type="date" data-report-filter="${key}:from" value="${f.from}"></div>
        <div class="field"><label>To date</label><input type="date" data-report-filter="${key}:to" value="${f.to}"></div>`}

function applyReportFilter(rows, key, getters){
  const f = getReportFilter(key);
  getters = getters || {};
  return rows.filter(r=>{
    if(f.from && getters.date && getters.date(r) < f.from) return false;
    if(f.to && getters.date && getters.date(r) > f.to) return false;
    if(f.status && getters.status && getters.status(r) !== f.status) return false;
    if(f.search && getters.search){
      const hay = getters.search(r) || '';
      if(!hay.toLowerCase().includes(f.search.trim().toLowerCase())) return false;
    }
    return true;
  });
}

function reportTable(headers, rows){

  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ---------------- Events ---------------- */
function bindGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ ui.tab = el.getAttribute('data-nav'); ui.formOpen = {}; ui.sidebarOpen = false; ui.invoiceOrderId = null; ui.viewingEstimateId = null; ui.viewingPOId = null; ui.editingOrderId = null; ui.receivingPOId = null; render(); };
  });
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = ()=>{ logout(); render(); };
  const menuBtn = document.getElementById('menuBtn');
  if(menuBtn) menuBtn.onclick = ()=>{ ui.sidebarOpen = !ui.sidebarOpen; render(); };
  const overlay = document.getElementById('sidebarOverlay');
  if(overlay) overlay.onclick = ()=>{ ui.sidebarOpen = false; render(); };
  document.querySelectorAll('[data-navgroup]').forEach(el=>{
    el.onclick = ()=>{
      const g = el.getAttribute('data-navgroup');
      ui.navGroupsOpen[g] = !(ui.navGroupsOpen[g] !== false);
      render();
    };
  });
}

function bindTabEvents(){
  document.querySelectorAll('[data-goto-collections]').forEach(el=>{
    el.onclick = ()=>{ ui.tab = 'collections'; ui.formOpen = {}; render(); };
  });
  document.querySelectorAll('[data-invsub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.inventory = el.getAttribute('data-invsub'); render(); };
  });
  document.querySelectorAll('[data-dispatchsub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.dispatch = el.getAttribute('data-dispatchsub'); render(); };
  });
  document.querySelectorAll('[data-servicesub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.service = el.getAttribute('data-servicesub'); render(); };
  });
  document.querySelectorAll('[data-reportsub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.reports = el.getAttribute('data-reportsub'); render(); };
  });
  document.querySelectorAll('[data-approvalsub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.approval = el.getAttribute('data-approvalsub'); render(); };
  });
  document.querySelectorAll('[data-collectionssub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.collections = el.getAttribute('data-collectionssub'); render(); };
  });
  document.querySelectorAll('[data-report-filter]').forEach(el=>{
    const apply = ()=>{
      const [key, field] = el.getAttribute('data-report-filter').split(':');
      getReportFilter(key)[field] = el.value;
      render();
    };
    el.addEventListener('change', apply);
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') apply(); });
  });
  document.querySelectorAll('[data-svcpaysub]').forEach(el=>{
    el.onclick = ()=>{ ui.subtab.servicePayments = el.getAttribute('data-svcpaysub'); render(); };
  });
  document.querySelectorAll('[data-toggle-service-history]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-toggle-service-history');
      ui.viewingServiceHistoryId = ui.viewingServiceHistoryId===id ? null : id;
      render();
    };
  });
  // generic open-form toggles
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{
      const k=el.getAttribute('data-open');
      const opening = !ui.formOpen[k];
      ui.formOpen[k]=opening;
      if(opening && k==='order' && !ui.pendingLeadPrefill){ ui.orderDraftItems = []; ui.itemPanelOpen.order = false; ui.orderDraftCustomer = null; ui.editingItemIndex.order = null; ui.editingOrderId = null; }
      if(opening && k==='estimate'){ ui.estimateDraftItems = []; ui.itemPanelOpen.estimate = false; ui.estimateDraftCustomer = null; ui.editingItemIndex.estimate = null; ui.editingEstimateId = null; }
      render();
    };
  });
  document.querySelectorAll('[data-open-item-panel]').forEach(el=>{
    el.onclick = ()=>{

    const docType = ui.viewingEstimateId ? 'estimate' : (ui.viewingPOId ? 'po' : 'order');
    const doc = docType==='estimate' ? db.estimates.find(x=>x.id===ui.viewingEstimateId)
              : docType==='po' ? db.purchaseOrders.find(x=>x.id===ui.viewingPOId)
              : db.orders.find(o=>o.id===ui.invoiceOrderId);
    if(!doc) return;
    const firm = getFirm(doc.firmId);
    const docNo = docType==='estimate' ? docNumber('estimate', doc) : docType==='po' ? docNumber('po', doc) : docNumber('invoice', doc);
    const total = docType==='estimate' ? estimateTotal(doc) : docType==='po' ? poTotal(doc) : orderTotal(doc);
    let msg;
    if(docType==='estimate'){
      msg = `Hello ${doc.customerName}, here is your estimate ${docNo} from ${firm.companyName}.\nTotal: ${fmtMoney(total)}`;
    } else if(docType==='po'){
      msg = `Hello ${doc.supplier}, please find purchase order ${docNo} from ${firm.companyName}.\nTotal: ${fmtMoney(total)}`;
    } else {
      const paid = Number(doc.paymentReceived)||0;
      const balance = total - paid;
      msg = `Hello ${doc.customerName}, here is your invoice ${docNo} from ${firm.companyName}.\nTotal: ${fmtMoney(total)}\nPaid: ${fmtMoney(paid)}\nBalance due: ${fmtMoney(balance)}`;
    }
    const originalLabel = shareWhatsappBtn.textContent;
    shareWhatsappBtn.disabled = true;
    shareWhatsappBtn.textContent = 'Preparing…';
    generateInvoicePdf(function(blob){
      shareWhatsappBtn.disabled = false;
      shareWhatsappBtn.textContent = originalLabel;
      const fileName = docNo + '.pdf';
      const file = blob ? new File([blob], fileName, {type:'application/pdf'}) : null;
      const docLabel = docType==='estimate'?'Estimate ':docType==='po'?'Purchase Order ':'Invoice ';
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:docLabel+docNo, text: msg}).catch(()=>{});
      } else {
        if(blob){
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = fileName;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(()=>URL.revokeObjectURL(url), 4000);
        }
        const waText = msg + (blob ? `\n\n(${docLabel.trim()} PDF has been downloaded — attach it to this chat)` : '');
        window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(waText), '_blank');
      }

    const file = fileInput && fileInput.files[0];
    if(!file){ alert('Choose a file first.'); return; }
    if(!window.XLSX){ alert('The upload library failed to load — check your internet connection and try again.'); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        const norm = (obj, keys)=>{
          for(const k of Object.keys(obj)){
            const kl = k.toLowerCase().trim();
            for(const target of keys){ if(kl===target) return obj[k]; }
          }
          return '';
        };
        const toDateStr = (v)=>{
          if(!v) return '';
          if(v instanceof Date) return v.toISOString().slice(0,10);
          return String(v);
        };
        let added=0, updated=0; const errors=[];
        rows.forEach((row, idx)=>{
          const name = String(norm(row, ['product name','productname','item name','product'])).trim();
          if(!name){ errors.push(`Row ${idx+2}: missing product name.`); return; }
          const qty = Number(norm(row, ['quantity','qty','stock qty','stock quantity']))||0;
          const category = String(norm(row, ['category'])).trim() || db.settings.productCategories[db.settings.productCategories.length-1];
          const unitPrice = Number(norm(row, ['unit price','price','rate']))||0;
          const reorderLevel = Number(norm(row, ['reorder level','reorder'])) || 5;
          const batchNo = String(norm(row, ['batch no','batch no.','batch'])).trim();
          const mrp = norm(row, ['mrp']) !== '' ? Number(norm(row, ['mrp'])) : null;
          const mfgDate = toDateStr(norm(row, ['mfg date','manufacture date','mfg. date']));
          const expDate = toDateStr(norm(row, ['exp date','expiry date','exp. date']));
          let item = findInventoryByName(name);
          if(item){
            item.stockQty += qty;
            if(unitPrice) item.unitPrice = unitPrice;
            if(batchNo) item.batchNo = batchNo;
            if(mrp!=null) item.mrp = mrp;
            if(mfgDate) item.mfgDate = mfgDate;
            if(expDate) item.expDate = expDate;
            updated++;
          } else {
            db.inventory.push({
              id: 'INV-'+(db.inventory.length+1),
              productName: name, category, stockQty: qty, unitPrice, reorderLevel,
              batchNo, mrp, mfgDate, expDate,
            });
            added++;
          }
        });
        ui.bulkUploadResult = {added, updated, errors};
        saveDb(); render();
      }catch(err){
        alert('Could not read that file — make sure it\'s a valid .xlsx or .csv with a header row.');
      }
    };

    el.onclick = ()=>{
      const id = el.getAttribute('data-save-user-password');
      const u = db.users.find(x=>x.id===id);
      const inp = document.getElementById('editPw_'+id);
      const val = inp ? inp.value.trim() : '';
      if(!val){ alert('Password cannot be empty.'); return; }
      u.password = val;
      ui.editingUserPasswordId = null;
      saveDb(); render();
    };
  });
  document.querySelectorAll('[data-user-role]').forEach(el=>{
    el.onchange = ()=>{
      const id = el.getAttribute('data-user-role');
      const u = db.users.find(x=>x.id===id);
      u.role = el.value;
      saveDb(); render();
    };
  });
  document.querySelectorAll('[data-remove-user]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-remove-user');
      db.users = db.users.filter(u=>u.id!==id);
      saveDb();
      if(session===id){ logout(); }
      render();
    };
  });
  document.querySelectorAll('[data-perm-role]').forEach(el=>{
    el.onchange = ()=>{
      const role = el.getAttribute('data-perm-role');
      const mod = el.getAttribute('data-perm-module');
      let list = db.settings.permissions[role] || [];
      if(el.checked){ if(!list.includes(mod)) list.push(mod); }
      else { list = list.filter(m=>m!==mod); }
      db.settings.permissions[role] = list;
      saveDb();
    };
  });
  const addSourceForm = document.getElementById('addSourceForm');
  if(addSourceForm) addSourceForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(addSourceForm);
    const v = fd.get('value').trim();
    if(v) db.settings.leadSources.push(v);
    saveDb(); render();
  };
  document.querySelectorAll('[data-remove-source]').forEach(el=>{
    el.onclick = ()=>{ db.settings.leadSources.splice(Number(el.getAttribute('data-remove-source')),1); saveDb(); render(); };
  });
  document.querySelectorAll('[data-edit-source]').forEach(el=>{
    el.onclick = ()=>{
      const idx = Number(el.getAttribute('data-edit-source'));
      const oldVal = db.settings.leadSources[idx];
      const newVal = prompt('Rename lead source:', oldVal);
      if(newVal===null) return;
      const trimmed = newVal.trim();
      if(!trimmed) return;
      db.settings.leadSources[idx] = trimmed;
      db.leads.forEach(l=>{ if(l.source===oldVal) l.source = trimmed; });
      saveDb(); render();
    };
  });
  const addCategoryForm = document.getElementById('addCategoryForm');
  if(addCategoryForm) addCategoryForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(addCategoryForm);
    const v = fd.get('value').trim();
    if(v) db.settings.productCategories.push(v);
    saveDb(); render();
  };
  document.querySelectorAll('[data-remove-category]').forEach(el=>{
    el.onclick = ()=>{ db.settings.productCategories.splice(Number(el.getAttribute('data-remove-category')),1); saveDb(); render(); };
  });
  document.querySelectorAll('[data-edit-category]').forEach(el=>{
    el.onclick = ()=>{
      const idx = Number(el.getAttribute('data-edit-category'));
      const oldVal = db.settings.productCategories[idx];
      const newVal = prompt('Rename product category:', oldVal);
      if(newVal===null) return;
      const trimmed = newVal.trim();
      if(!trimmed) return;
      db.settings.productCategories[idx] = trimmed;
      db.inventory.forEach(i=>{ if(i.category===oldVal) i.category = trimmed; });
      saveDb(); render();
    };
  });
  const addLeadStatusForm = document.getElementById('addLeadStatusForm');
  if(addLeadStatusForm) addLeadStatusForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(addLeadStatusForm);
    const v = fd.get('value').trim();
    if(v) db.settings.leadStatuses.push(v);
    saveDb(); render();
  };
  document.querySelectorAll('[data-remove-lead-status]').forEach(el=>{
    el.onclick = ()=>{
      const idx = Number(el.getAttribute('data-remove-lead-status'));
      const removed = db.settings.leadStatuses[idx];
      db.settings.leadStatuses.splice(idx,1);
      if(db.settings.leadWonStatus===removed) db.settings.leadWonStatus = db.settings.leadStatuses[0]||'';
      saveDb(); render();
    };
  });
  document.querySelectorAll('[data-edit-lead-status]').forEach(el=>{
    el.onclick = ()=>{
      const idx = Number(el.getAttribute('data-edit-lead-status'));
      const oldVal = db.settings.leadStatuses[idx];
      const newVal = prompt('Rename lead status:', oldVal);
      if(newVal===null) return;
      const trimmed = newVal.trim();
      if(!trimmed) return;
      db.settings.leadStatuses[idx] = trimmed;
      if(db.settings.leadWonStatus===oldVal) db.settings.leadWonStatus = trimmed;
      db.leads.forEach(l=>{ if(l.status===oldVal) l.status = trimmed; });
      saveDb(); render();
    };
  });
  const leadWonStatusSelect = document.getElementById('leadWonStatusSelect');
  if(leadWonStatusSelect) leadWonStatusSelect.onchange = ()=>{
    db.settings.leadWonStatus = leadWonStatusSelect.value;
    saveDb(); render();
  };
}

function renderLoadErrorScreen(msg){
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px;box-sizing:border-box;">
      <div style="background:var(--card);border-radius:6px;padding:30px 26px;width:100%;max-width:380px;box-sizing:border-box;text-align:center;">
        <div style="font-weight:700;font-size:18px;margin-bottom:10px;">Couldn't load your data</div>
        <div class="note" style="margin-bottom:18px;text-align:left;">${escapeHtml(msg)}<br><br>Your data is safe — this app never overwrites what's stored just because a connection attempt failed. Check your internet connection, then try again.</div>
        <button class="btn" id="retryLoadBtn" style="width:100%;margin-bottom:10px;">Try again</button>
        <button class="btn secondary" id="reconfigureBtn" style="width:100%;">Reconfigure database connection</button>
      </div>
    </div>
  `;
}
function renderSetupScreen(errorMsg){
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px;box-sizing:border-box;">
      <div style="background:var(--card);border-radius:6px;padding:30px 26px;width:100%;max-width:380px;box-sizing:border-box;">
        <div style="font-weight:700;font-size:18px;margin-bottom:4px;">Connect your database</div>
        <div class="mono" style="font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:18px;">FIRST-TIME SETUP</div>
        <div class="note" style="margin-bottom:16px;">This app stores its data in your own free Supabase project — nothing is shared with anyone else. Enter your project's details below; they're saved only in this browser.</div>
        <form id="setupForm">
          <div class="field" style="margin-bottom:12px;"><label>Supabase Project URL</label><input name="sbUrl" placeholder="https://xxxxxxxx.supabase.co" required></div>
          <div class="field" style="margin-bottom:16px;"><label>Supabase anon (public) key</label><input name="sbKey" placeholder="eyJ..." required></div>
          ${errorMsg? `<div class="banner" style="background:var(--red-bg);color:var(--red);">${escapeHtml(errorMsg)}</div>` : ''}
          <button class="btn" type="submit" style="width:100%;">Connect</button>
        </form>
        <div class="note" style="margin-top:14px;">Don't have a Supabase project yet? Create a free one at supabase.com, add an <span class="mono">app_data</span> table (key text primary key, value jsonb), then paste your Project URL and anon key here.</div>
      </div>
    </div>
  `;
}
function bootstrapApp(errorMsg){
  const cfg = getSupabaseConfig();
  if(!cfg){
    document.getElementById('app').innerHTML = renderSetupScreen(errorMsg);
    const form = document.getElementById('setupForm');
    form.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      saveSupabaseConfig(fd.get('sbUrl'), fd.get('sbKey'));
      bootstrapApp();
    };
    return;
  }
  loadDb();
}
bootstrapApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// Global, one-time listener: powers every show/hide password toggle across re-renders.
document.addEventListener('click', function(e){
  const btn = e.target.closest && e.target.closest('.pw-toggle');
  if(!btn) return;
  const inp = document.getElementById(btn.getAttribute('data-target'));
  if(!inp) return;
  if(inp.type==='password'){ inp.type='text'; btn.textContent='Hide'; }
  else { inp.type='password'; btn.textContent='Show'; }
});
</script>
